{% extends "base.html" %}
{% block title %}Login — TimetableGen{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">🗓️</div>
    <h2>College Timetable Generator</h2>
    <p class="auth-sub">Sign in to continue</p>

    <form method="POST" action="{{ url_for('auth_login') }}" id="loginForm">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" class="form-control"
               placeholder="admin@college.edu" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-input-wrapper">
          <input type="password" id="password" name="password" class="form-control"
                 placeholder="••••••••" required>
          <button type="button" class="password-toggle-btn" onclick="togglePassword('password', this)"
                  aria-label="Show password" title="Show password">
            <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg class="eye-off-icon" style="display:none;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>

      <div class="demo-box mt-3" style="border-top: 1px dashed var(--border); padding-top: 14px;">
        <button type="button" class="btn btn-outline btn-block" onclick="fillDemo('admin@college.edu', 'admin123')"
                title="Click to automatically fill demo credentials">
          ⚡ Demo: Fill Credentials
        </button>
      </div>
    </form>

    <div class="mt-3" style="font-size: 0.9rem;">
      Don't have an account? <a href="{{ url_for('auth_register') }}" style="font-weight: 600;">Register here</a>
    </div>

    <p class="auth-hint">Default: admin@college.edu / admin123</p>
  </div>
</div>

<script>
function fillDemo(email, password) {
  const emailInput = document.getElementById('email');
  const passInput = document.getElementById('password');
  emailInput.value = email;
  passInput.value = password;
  passInput.focus();
}
</script>
{% endblock %}
