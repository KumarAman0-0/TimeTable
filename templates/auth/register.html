{% extends "base.html" %}
{% block title %}Register — TimetableGen{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">🗓️</div>
    <h2>Create Account</h2>
    <p class="auth-sub">Register to access the Timetable Generator</p>

    <form method="POST" action="{{ url_for('auth_register') }}" id="registerForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" class="form-control"
               placeholder="e.g. Aman Kumar" value="{{ name or '' }}" required autofocus>
      </div>

      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" class="form-control"
               placeholder="e.g. aman@college.edu" value="{{ email or '' }}" required>
      </div>

      <div class="form-group">
        <label for="role">Register as</label>
        <select id="role" name="role" class="form-control" required>
          <option value="student" {% if role == 'student' %}selected{% endif %}>Student</option>
          <option value="teacher" {% if role == 'teacher' %}selected{% endif %}>Teacher / Faculty</option>
          <option value="admin"   {% if role == 'admin' %}selected{% endif %}>Administrator</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">Password (min 6)</label>
          <input type="password" id="password" name="password" class="form-control"
                 placeholder="••••••••" minlength="6" required>
        </div>
        <div class="form-group">
          <label for="confirm_password">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                 placeholder="••••••••" minlength="6" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block mt-2">Create Account</button>

      <div class="demo-box mt-3" style="border-top: 1px dashed var(--border); padding-top: 14px;">
        <button type="button" class="btn btn-outline btn-block" onclick="fillRegisterDemo()"
                title="Click to automatically fill demo user details">
          ⚡ Demo: Fill Register Form
        </button>
      </div>
    </form>

    <div class="mt-3" style="font-size: 0.9rem;">
      Already have an account? <a href="{{ url_for('auth_login') }}" style="font-weight: 600;">Sign In here</a>
    </div>
  </div>
</div>

<script>
function fillRegisterDemo() {
  const rand = Math.floor(100 + Math.random() * 900);
  document.getElementById('name').value = 'Prof. Aman ' + rand;
  document.getElementById('email').value = 'aman' + rand + '@college.edu';
  document.getElementById('role').value = 'teacher';
  document.getElementById('password').value = 'secret123';
  document.getElementById('confirm_password').value = 'secret123';
}
</script>
{% endblock %}
