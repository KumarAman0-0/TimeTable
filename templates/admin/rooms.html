{% extends "base.html" %}
{% block title %}Rooms — TimetableGen{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Rooms &amp; Labs</h1>
  <button class="btn btn-primary" onclick="showModal('addModal')">+ Add Room</button>
</div>

<div class="card">
  <table class="table">
    <thead>
      <tr><th>Name</th><th>Type</th><th>Capacity</th><th>Actions</th></tr>
    </thead>
    <tbody>
      {% for r in rooms %}
      <tr>
        <td>{{ r.name }}</td>
        <td><span class="badge badge-secondary">{{ r.room_type }}</span></td>
        <td>{{ r.capacity }}</td>
        <td>
          <button class="btn btn-sm btn-secondary"
            onclick="fillEdit({{ r.id }}, '{{ r.name }}', '{{ r.room_type }}', {{ r.capacity }})">Edit</button>
          <form method="POST" action="{{ url_for('room_delete', rid=r.id) }}" style="display:inline"
                onsubmit="return confirm('Delete room?')">
            <button class="btn btn-sm btn-danger">Delete</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="4" class="center">No rooms yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<!-- Add Modal -->
<div id="addModal" class="modal" style="display:none">
  <div class="modal-content">
    <div class="modal-header"><h3>Add Room</h3><span onclick="hideModal('addModal')" class="modal-close">✕</span></div>
    <form method="POST" action="{{ url_for('room_add') }}">
      <div class="form-group"><label>Room Name</label>
        <input name="name" class="form-control" required placeholder="Room 101"></div>
      <div class="form-group"><label>Type</label>
        <select name="room_type" class="form-control">
          {% for rt in room_types %}<option value="{{ rt }}">{{ rt }}</option>{% endfor %}
        </select></div>
      <div class="form-group"><label>Capacity</label>
        <input name="capacity" type="number" min="1" value="60" class="form-control"></div>
      <button type="submit" class="btn btn-primary">Add Room</button>
    </form>
  </div>
</div>

<!-- Edit Modal -->
<div id="editModal" class="modal" style="display:none">
  <div class="modal-content">
    <div class="modal-header"><h3>Edit Room</h3><span onclick="hideModal('editModal')" class="modal-close">✕</span></div>
    <form id="editForm" method="POST">
      <div class="form-group"><label>Name</label><input id="edit_name" name="name" class="form-control"></div>
      <div class="form-group"><label>Type</label>
        <select id="edit_type" name="room_type" class="form-control">
          {% for rt in room_types %}<option value="{{ rt }}">{{ rt }}</option>{% endfor %}
        </select></div>
      <div class="form-group"><label>Capacity</label>
        <input id="edit_cap" name="capacity" type="number" min="1" class="form-control"></div>
      <button type="submit" class="btn btn-primary">Save</button>
    </form>
  </div>
</div>

<script>
function fillEdit(id, name, type, cap) {
  document.getElementById('edit_name').value = name;
  document.getElementById('edit_type').value = type;
  document.getElementById('edit_cap').value  = cap;
  document.getElementById('editForm').action = `/rooms/${id}/edit`;
  showModal('editModal');
}
</script>
{% endblock %}
